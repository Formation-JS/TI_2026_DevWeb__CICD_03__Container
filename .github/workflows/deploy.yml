name: Deploy container on render.com

on: 
  workflow_dispatch:
  push:
    branches: [main]

env:
  DOCKERHUB_TAG: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}:latest

jobs:
  #TODO Ajouter un job pour lancer les tests (quand il y en aura)
  build_container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout # Récuperation du code de repo git
        uses: actions/checkout@v6
      - name: Login to DockerHub # Connection à DockerHub avec le token
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push # Construction du image en envoi sur dockerhub
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.ref == 'refs/heads/main' }} # Ok si branch main
          tags: ${{ env.DOCKERHUB_TAG }}
  auto_deploy:
    needs: build_container
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy # Lancer la mise à jours sur render.com
        run: curl ${{ secrets.RENDER_TRIGGER_URL }}
